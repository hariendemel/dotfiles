git:
  diffRenderers:
    - command: delta --dark --paging=never
customCommands:
  - key: 'k'
    context: 'files'
    description: 'Commit with AI-generated message'
    prompts:
      - type: 'input'
        title: 'Commit message (generated — edit as needed)'
        key: 'Message'
        initialValue: "{{ runCommand \"commit-message | head -1\" }}"
    command: 'git commit -m {{.Form.Message | quote}}'
    loadingText: 'Asking Claude for a commit message...'
gui:
  theme:
    activeBorderColor:
      - '#f5bde6'
      - bold
    inactiveBorderColor:
      - '#a6adc8'
    optionsTextColor:
      - '#89b4fa'
    selectedLineBgColor:
      - '#313244'
    cherryPickedCommitBgColor:
      - '#45475a'
    cherryPickedCommitFgColor:
      - '#89b4fa'
    unstagedChangesColor:
      - '#f38ba8'
    defaultFgColor:
      - '#cdd6f4'
    searchingActiveBorderColor:
      - '#f9e2af'
