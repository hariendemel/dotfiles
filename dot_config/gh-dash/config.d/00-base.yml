prSections:
  - title: My PRs
    filters: is:open author:@me
  - title: Ready to Review
    filters: is:open review-requested:@me draft:false
  - title: Review Draf
    filters: is:open review-requested:@me draft:true
  - title: Involved
    filters: is:open involves:@me -author:@me
issuesSections:
  - title: My Issues
    filters: is:open author:@me
  - title: Assigned
    filters: is:open assignee:@me
  - title: Involved
    filters: is:open involves:@me -author:@me
notificationsSections:
  - title: All
    filters: ""
  - title: Created
    filters: reason:author
  - title: Participating
    filters: reason:participating
  - title: Mentioned
    filters: reason:mention
  - title: Review Requested
    filters: reason:review-requested
  - title: Assigned
    filters: reason:assign
  - title: Subscribed
    filters: reason:subscribed
  - title: Team Mentioned
    filters: reason:team-mention
repo:
  branchesRefetchIntervalSeconds: 30
  prsRefetchIntervalSeconds: 60
keybindings:
  prs:
    - key: /
      name: Review in herdr
      command: >-
        herdr tab create --label "PR-{{.PrNumber}}" --cwd "{{.RepoPath}}"
    - key: ">"
      name: Workflows
      command: >-
        herdr pane run 
        $(herdr tab create --label 'Wfl-{{.PrNumber}}' | 
        jq -r '.result.root_pane.pane_id')
        "gh enhance -R {{.RepoName}} {{.PrNumber}}"
pager:
  diff: "diffnav"
confirmQuit: false
showAuthorIcons: true
smartFilteringAtLaunch: true
includeReadNotifications: true
