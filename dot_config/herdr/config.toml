onboarding = false

[theme]
name = "catppuccin"

[ui]
prompt_new_tab_name = false

[ui.toast.herdr]
position = "top-right"

[keys]
new_tab = "prefix+t"
switch_workspace = "alt+1..9"
focus_agent = "alt+shift+1..9"

[[keys.command]]
key = "prefix+/"
type = "popup"
command = "lazygit"
description = "run lazygit"
width = "90%"
height = "90%"

[[keys.command]]
key = "prefix+>"
type = "popup"
command = "exec \"${SHELL:-sh}\""
description = "open scratch terminal"
width = "60%"
height = "60%"
